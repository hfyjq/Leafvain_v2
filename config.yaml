model:
  provider: <PROVIDER>
  model_name: <MODEL_NAME>
  api_key: <API_KEY>
  base_url: <BASE_URL>
  temperature: <TEMPERATURE>
  max_tokens: <MAX_TOKENS>
  context_window: <CONTEXT_WINDOW>

security:
  allowed_directories:
    - ./data/workspaces
  command_blacklist:
    - sudo
    - rm -rf
    - del /f
    - format
  audit_log_path: ./logs/audit.log

chunking:
  max_chars: 1500

retrieval:
  top_k: 3

summarization:
  chunk_summary_max_chars: 200
  merge_batch_size: 3

memory:
  enabled: true
  storage_path: ./data/memory
  short_term:
    max_messages: 500
  compression:
    token_threshold: 0.85
    keep_recent_turns: 3
  long_term:
    chroma_path: ./data/memory/chroma
  semantic:
    db_path: ./data/memory/profile.db
