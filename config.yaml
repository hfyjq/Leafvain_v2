model:
  provider: <PROVIDER>
  model_name: <MODEL_NAME>
  api_key: <API_KEY>
  base_url: <BASE_URL>
  temperature: <TEMPERATURE>
  max_tokens: <MAX_TOKENS>
  context_window: <CONTEXT_WINDOW>

security:
  allowed_directories:
    - ./data/workspaces
  command_blacklist:
    - sudo
    - rm -rf
    - del /f
    - format
  audit_log_path: ./logs/audit.log

chunking:
  max_chars: 1500

retrieval:
  top_k: 3

summarization:
  chunk_summary_max_chars: 200
  merge_batch_size: 3

tool_result_max_chars: 2000

memory:
  enabled: true
  storage_path: ./data/memory
  short_term:
    max_messages: 500
    max_history: 100
  compression:
    token_threshold: 0.85
    keep_recent_turns: 3
  long_term:
    chroma_path: ./data/memory/chroma
  semantic:
    db_path: ./data/memory/profile.db
  session_memory:
    sessions_dir: ./data/memory/sessions

channel:
  default: <CHANNEL_DEFAULT>
  telegram:
    bot_token: <TELEGRAM_BOT_TOKEN>
    polling_timeout: <POLLING_TIMEOUT>
    proxy: <PROXY_URL>
  wechat:
    credentials_path: ./data/wechat_credentials.json
    base_url: https://ilinkai.weixin.qq.com
    polling_timeout: 35
    aggregation_delay: 1.5
