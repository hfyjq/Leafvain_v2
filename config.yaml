model:
  provider: <PROVIDER>
  model_name: <MODEL_NAME>
  api_key: <API_KEY>
  base_url: <BASE_URL>
  temperature: <TEMPERATURE>
  max_tokens: <MAX_TOKENS>

security:
  allowed_directories:
    - ./data/workspaces
  command_blacklist:
    - sudo
    - rm -rf
    - del /f
    - format
  audit_log_path: ./logs/audit.log

chunking:
  max_chars: 1500

retrieval:
  top_k: 3

summarization:
  chunk_summary_max_chars: 200
  merge_batch_size: 3
