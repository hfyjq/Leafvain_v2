[project]
name = "leafvain"
version = "0.1.0"
description = "Modular AI Agent Framework — lightweight document analysis assistant"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "PyMuPDF>=1.24.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
    "openpyxl>=3.1.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "bus", "skills", "providers", "channels"]